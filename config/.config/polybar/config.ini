;=============================================================
; Polybar config for bspwm  (Void Linux)
; Text-based, DejaVu Sans, native systray.
;=============================================================

[colors]
background     = #dd222222
foreground     = #eeeeee
muted          = #888888
accent         = #6699cc
alert          = #cc6666

[bar/main]
; If you ever go multi-monitor, set: monitor = ${env:MONITOR:}
width          = 100%
height         = 26
radius         = 0
background     = ${colors.background}
foreground     = ${colors.foreground}

line-size      = 2
padding-left   = 0
padding-right  = 0
module-margin  = 1

font-0 = DejaVu Sans:size=10;2
font-1 = DejaVu Sans:style=Bold:size=10;2

modules-left   = bspwm
modules-center = date
; tray lives at the far right (dedicated module, polybar >= 3.7)
modules-right  = pulseaudio memory cpu battery tray

cursor-click   = pointer

[module/bspwm]
type = internal/bspwm
; show the 10 workspaces, numbered
label-focused            = %name%
label-focused-foreground = ${colors.foreground}
label-focused-background = ${colors.accent}
label-focused-padding    = 1

label-occupied           = %name%
label-occupied-padding   = 1

label-empty              = %name%
label-empty-foreground   = ${colors.muted}
label-empty-padding      = 1

label-urgent             = %name%
label-urgent-foreground  = ${colors.alert}
label-urgent-padding     = 1

[module/date]
type = internal/date
interval = 5
date = %a %d %b
time = %H:%M
label = %date%  %time%

[module/cpu]
type = internal/cpu
interval = 2
label = cpu %percentage:2%%

[module/memory]
type = internal/memory
interval = 3
label = mem %percentage_used:2%%

[module/pulseaudio]
type = internal/pulseaudio
label-volume = vol %percentage%%
label-muted = muted
label-muted-foreground = ${colors.muted}

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 99
poll-interval = 5
label-charging    = chr %percentage%%
label-discharging = bat %percentage%%
label-full        = full %percentage%%
label-low         = low %percentage%%
low-at = 15
label-low-foreground = ${colors.alert}

; --- system tray (only one tray owner may exist at a time) ---
[module/tray]
type = internal/tray
tray-size = 18px
tray-spacing = 2px
tray-background = ${colors.background}

[settings]
screenchange-reload = true
pseudo-transparency = true
